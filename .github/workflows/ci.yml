name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A full run takes about 7 minutes. Twice a run hung in `npm test` (never in the same test locally) and would have
    # held a runner for GitHub's 6-hour default; this fails it instead, with the log showing where it stopped.
    timeout-minutes: 20
    env:
      # Where mongodb-memory-server keeps its MongoDB binary (cached below).
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binary-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
