# Render Blueprint: one web service that builds the React app and serves it with the API (see README, "Deploy").
# Secrets are marked sync: false, so Render asks for them in the dashboard; they are never in this file.
services:
  - type: web
    name: bazaar
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      # The in-memory MongoDB is only for tests and the demo; don't download it while building.
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: '1'
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: shop
      # The visitor's IP for limiting login tries per network: Render's Cloudflare edge sets this header itself, while
      # X-Forwarded-For starts with whatever the visitor sent (checked with GET /api/admin/request-info).
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Order emails (Brevo). PUBLIC_URL is this site's address, for the links in them.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PUBLIC_URL
        sync: false
      # Optional: Google Search Console's HTML-tag code (only the content="…" part), to prove the site is yours.
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      # Optional: where new-order alerts go; without it, every admin account is emailed.
      - key: ADMIN_EMAIL
        sync: false
